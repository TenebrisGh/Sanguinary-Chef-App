<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soup House - Diner Management</title>
    <style>
        :root {
            --bg-color: #1c130e;
            --floor-color: #2c1d14;
            --counter-color: #5c3a21;
            --accent-gold: #ffb703;
            --text-color: #f1faee;
            --red-alert: #e63946;
            --green-good: #2a9d8f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            color: var(--accent-gold);
            margin: 0;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 12px;
            color: #d3d3d3;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            background: #3a2518;
            padding: 8px 15px;
            border-radius: 8px;
            border: 2px solid var(--accent-gold);
            box-sizing: border-box;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Game Layout Area */
        #game-container {
            width: 100%;
            max-width: 480px;
            height: 380px;
            background-color: var(--floor-color);
            border: 3px solid var(--counter-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        /* Kitchen / Counter Zone */
        .kitchen-counter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: var(--counter-color);
            border-bottom: 4px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .soup-pot {
            background: #444;
            border: 2px solid #888;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
            box-shadow: inset 0 0 8px #000;
            transition: transform 0.1s;
        }

        .soup-pot:active {
            transform: scale(0.9);
        }

        .soup-pot.lentil { background: #e9c46a; color: #000; }
        .soup-pot.iskembe { background: #f4f1de; color: #000; }
        .soup-pot.beyran { background: #e63946; color: #fff; }
        .soup-pot.ezogelin { background: #f4a261; color: #000; }

        /* Dining Area Tables */
        .dining-area {
            position: absolute;
            top: 90px;
            width: 100%;
            height: 280px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .table-spot {
            background: #4a3121;
            border: 3px solid #6b472f;
            border-radius: 50%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .table-label {
            font-size: 11px;
            color: #ccc;
            position: absolute;
            bottom: 5px;
        }

        /* Customer & Order Bubble */
        .customer {
            font-size: 32px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }

        .order-bubble {
            position: absolute;
            top: -25px;
            background: white;
            color: black;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        /* Chef / Waiter Hands Indicator */
        .holding-box {
            margin-top: 10px;
            width: 100%;
            max-width: 480px;
            background: #25170f;
            border: 1px dashed var(--accent-gold);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
        }

        .holding-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .holding-item {
            font-size: 16px;
            color: var(--accent-gold);
            font-weight: bold;
        }

        #feedback {
            margin-top: 8px;
            height: 20px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Soup House</h1>
        <div class="subtitle">Traditional Turkish Soup Diner Management</div>
    </header>

    <div class="stats-bar">
        <span>Score: <span id="score" style="color: var(--accent-gold);">0</span></span>
        <span>Time: <span id="timer" style="color: #ff6b6b;">60s</span></span>
    </div>

    <div id="game-container">
        <!-- Kitchen Pots -->
        <div class="kitchen-counter">
            <div class="soup-pot lentil" onclick="cookSoup('Lentil Soup')">
                🥣<span>Lentil</span>
            </div>
            <div class="soup-pot iskembe" onclick="cookSoup('Iskembe Soup')">
                🥣<span>Iskembe</span>
            </div>
            <div class="soup-pot beyran" onclick="cookSoup('Beyran Soup')">
                🥣<span>Beyran</span>
            </div>
            <div class="soup-pot ezogelin" onclick="cookSoup('Ezogelin')">
                🥣<span>Ezogelin</span>
            </div>
        </div>

        <!-- Dining Tables -->
        <div class="dining-area">
            <div class="table-spot" id="table-0" onclick="serveTable(0)">
                <span class="table-label">Table 1</span>
            </div>
            <div class="table-spot" id="table-1" onclick="serveTable(1)">
                <span class="table-label">Table 2</span>
            </div>
            <div class="table-spot" id="table-2" onclick="serveTable(2)">
                <span class="table-label">Table 3</span>
            </div>
            <div class="table-spot" id="table-3" onclick="serveTable(3)">
                <span class="table-label">Table 4</span>
            </div>
        </div>
    </div>

    <div class="holding-box">
        <div class="holding-title">Chef Carrying:</div>
        <div class="holding-item" id="carrying-display">Empty Hands</div>
    </div>

    <div id="feedback"></div>

    <script>
        const soupTypes = ["Lentil Soup", "Iskembe Soup", "Beyran Soup", "Ezogelin"];
        const customerEmojis = ["🧔🏻‍♂️", "👨🏽", "🧕🏼", "👵🏻", "👨🏻‍🍳"];

        let carriedSoup = null;
        let score = 0;
        let timeLeft = 60;
        let gameTimer = null;
        let customerSpawner = null;

        // Table states: null or { customer: emoji, order: soupType }
        let tables = [null, null, null, null];

        function startGame() {
            score = 0;
            timeLeft = 60;
            carriedSoup = null;
            tables = [null, null, null, null];
            updateCarryingUI();
            updateScoreUI();
            renderTables();

            clearInterval(gameTimer);
            clearInterval(customerSpawner);

            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft + "s";
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Spawn customer every 2.5 seconds
            customerSpawner = setInterval(spawnCustomer, 2500);
            spawnCustomer(); // Immediate first spawn
        }

        function spawnCustomer() {
            let emptyIndices = [];
            tables.forEach((t, idx) => {
                if (t === null) emptyIndices.push(idx);
            });

            if (emptyIndices.length > 0) {
                let randomTable = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                let randomCustomer = customerEmojis[Math.floor(Math.random() * customerEmojis.length)];
                let randomOrder = soupTypes[Math.floor(Math.random() * soupTypes.length)];

                tables[randomTable] = {
                    customer: randomCustomer,
                    order: randomOrder
                };
                renderTables();
            }
        }

        function cookSoup(soupName) {
            carriedSoup = soupName;
            updateCarryingUI();
            showFeedback("Picked up " + soupName, "#ffb703");
        }

        function serveTable(tableIndex) {
            let table = tables[tableIndex];

            if (!table) {
                showFeedback("Table is empty!", "#aaa");
                return;
            }

            if (!carriedSoup) {
                showFeedback("Pick a soup from counter first!", "#ff6b6b");
                return;
            }

            if (carriedSoup === table.order) {
                score += 10;
                showFeedback("+10 Correct Soup Served!", "#2a9d8f");
                tables[tableIndex] = null; // Customer leaves satisfied
                carriedSoup = null;
            } else {
                score = Math.max(0, score - 5);
                showFeedback("-5 Wrong Order Served!", "#e63946");
                carriedSoup = null;
            }

            updateScoreUI();
            updateCarryingUI();
            renderTables();
        }

        function renderTables() {
            tables.forEach((t, idx) => {
                let el = document.getElementById("table-" + idx);
                if (t) {
                    el.innerHTML = `
                        <div class="order-bubble">Want: ${t.order}</div>
                        <div class="customer">${t.customer}</div>
                        <span class="table-label">Table ${idx + 1}</span>
                    `;
                } else {
                    el.innerHTML = `<span class="table-label">Table ${idx + 1} (Empty)</span>`;
                }
            });
        }

        function updateCarryingUI() {
            let display = document.getElementById("carrying-display");
            display.innerText = carriedSoup ? "🥣 " + carriedSoup : "Empty Hands";
        }

        function updateScoreUI() {
            document.getElementById("score").innerText = score;
        }

        function showFeedback(msg, color) {
            let fb = document.getElementById("feedback");
            fb.innerText = msg;
            fb.style.color = color;
            setTimeout(() => {
                if (fb.innerText === msg) fb.innerText = "";
            }, 1500);
        }

        function endGame() {
            clearInterval(gameTimer);
            clearInterval(customerSpawner);
            alert("Shift Ended! Total Soup House Revenue/Score: " + score);
            startGame();
        }

        window.onload = startGame;
    </script>
</body>
</html>
