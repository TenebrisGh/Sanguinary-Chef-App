<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soup House - Pro Landscape Diner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c0705;
            color: #f8f9fa;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }

        #hud-bar {
            width: 800px;
            background: linear-gradient(180deg, #3a2012 0%, #201109 100%);
            border: 2px solid #d4af37;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
            color: #ffb703;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        .stats-group {
            display: flex;
            gap: 25px;
            font-size: 15px;
            font-weight: bold;
        }

        .stat-item {
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #5c3a21;
        }

        .stat-score { color: #52b788; }
        .stat-time { color: #e63946; }
        .stat-holding { color: #ffb703; }

        canvas {
            background: #180d08;
            border: 3px solid #d4af37;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.9);
            cursor: pointer;
        }

        #footer-hints {
            margin-top: 6px;
            font-size: 12px;
            color: #a8a29e;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="hud-bar">
        <div class="brand">THE SOUP HOUSE</div>
        <div class="stats-group">
            <div class="stat-item">EARNINGS: $<span id="score" class="stat-score">0</span></div>
            <div class="stat-item">TIME: <span id="timer" class="stat-time">60</span>s</div>
            <div class="stat-item">CARRYING: <span id="holding" class="stat-holding">EMPTY</span></div>
        </div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="footer-hints">
        💡 <b>How to Play:</b> Click queue to seat customers ➔ Click pots to pick soup ➔ Click table to serve!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State
        let score = 0;
        let timeLeft = 60;
        let isGameActive = true;

        // Chef (Player) Object
        const chef = {
            x: 400,
            y: 180,
            targetX: 400,
            targetY: 180,
            speed: 0.12,
            holding: null,
            facing: 'right'
        };

        // Soups Configuration
        const soups = [
            { id: 'Lentil', name: 'Lentil Soup', mainColor: '#e9c46a', oilColor: '#e63946', x: 260, y: 55 },
            { id: 'Iskembe', name: 'İşkembe', mainColor: '#f4f1de', oilColor: '#e63946', x: 350, y: 55 },
            { id: 'Beyran', name: 'Beyran', mainColor: '#d62828', oilColor: '#ffb703', x: 440, y: 55 },
            { id: 'Ezogelin', name: 'Ezogelin', mainColor: '#f4a261', oilColor: '#d62828', x: 530, y: 55 }
        ];

        // Tables Layout (Landscape 6 Tables)
        const tables = [
            { id: 1, x: 180, y: 200, status: 'empty', customer: null, order: null, eatTimer: 0 },
            { id: 2, x: 400, y: 200, status: 'empty', customer: null, order: null, eatTimer: 0 },
            { id: 3, x: 620, y: 200, status: 'empty', customer: null, order: null, eatTimer: 0 },
            { id: 4, x: 180, y: 350, status: 'empty', customer: null, order: null, eatTimer: 0 },
            { id: 5, x: 400, y: 350, status: 'empty', customer: null, order: null, eatTimer: 0 },
            { id: 6, x: 620, y: 350, status: 'empty', customer: null, order: null, eatTimer: 0 }
        ];

        // Customer Queue
        let queue = [];
        const maxQueue = 4;
        const customerColors = ['#2a9d8f', '#e76f51', '#457b9d', '#9b5de5', '#f4a261'];

        // Customer Spawner
        setInterval(() => {
            if (isGameActive && queue.length < maxQueue) {
                const randomSoup = soups[Math.floor(Math.random() * soups.length)].id;
                const randomColor = customerColors[Math.floor(Math.random() * customerColors.length)];
                queue.push({
                    id: Date.now(),
                    color: randomColor,
                    order: randomSoup
                });
            }
        }, 3000);

        // Timer Loop
        const timerObj = setInterval(() => {
            if (isGameActive) {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    isGameActive = false;
                    clearInterval(timerObj);
                    setTimeout(() => alert("Shift Finished! Total Earnings: $" + score), 100);
                }
            }
        }, 1000);

        // Interaction Listener
        canvas.addEventListener("click", (e) => {
            if (!isGameActive) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // 1. Kitchen Counter Pots Click
            soups.forEach(soup => {
                if (Math.hypot(clickX - soup.x, clickY - soup.y) < 32) {
                    chef.targetX = soup.x;
                    chef.targetY = soup.y + 55;
                    chef.holding = soup.id;
                    updateHUD();
                }
            });

            // 2. Queue Click (Seat Customer)
            if (clickX < 80 && clickY > 100 && clickY < 380 && queue.length > 0) {
                let freeTable = tables.find(t => t.status === 'empty');
                if (freeTable) {
                    let cust = queue.shift();
                    freeTable.status = 'waiting';
                    freeTable.customer = cust;
                    freeTable.order = cust.order;
                }
            }

            // 3. Table Click (Serve)
            tables.forEach(table => {
                if (Math.hypot(clickX - table.x, clickY - table.y) < 50) {
                    chef.targetX = table.x;
                    chef.targetY = table.y + 40;

                    if (table.status === 'waiting' && chef.holding) {
                        if (chef.holding === table.order) {
                            score += 20;
                            table.status = 'eating';
                            table.eatTimer = 200;
                            chef.holding = null;
                        } else {
                            score = Math.max(0, score - 5);
                            chef.holding = null;
                        }
                        updateHUD();
                    }
                }
            });
        });

        function updateHUD() {
            document.getElementById("score").innerText = score;
            document.getElementById("holding").innerText = chef.holding ? chef.holding : "EMPTY";
        }

        // --- RENDER ENGINE ---

        function drawFloor() {
            // Dark Wood Floor
            ctx.fillStyle = "#20120b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Wood Planks
            ctx.strokeStyle = "#140b06";
            ctx.lineWidth = 2;
            for (let y = 100; y < canvas.height; y += 35) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Kitchen Bar Area
            ctx.fillStyle = "#3d2214";
            ctx.fillRect(0, 0, canvas.width, 100);
            ctx.fillStyle = "#5c341e";
            ctx.fillRect(0, 92, canvas.width, 8);

            // Red Carpet Waiting Zone
            ctx.fillStyle = "#6b0f1a";
            ctx.fillRect(10, 120, 55, 280);
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 2;
            ctx.strokeRect(10, 120, 55, 280);

            ctx.fillStyle = "#d4af37";
            ctx.font = "bold 10px Arial";
            ctx.textAlign = "center";
            ctx.fillText("WAITING", 37, 112);
        }

        function drawPots() {
            soups.forEach(soup => {
                // Copper Pot
                ctx.beginPath();
                ctx.arc(soup.x, soup.y, 25, 0, Math.PI * 2);
                ctx.fillStyle = "#b85d19";
                ctx.fill();
                ctx.strokeStyle = "#5a2a08";
                ctx.lineWidth = 3;
                ctx.stroke();

                // Liquid
                ctx.beginPath();
                ctx.arc(soup.x, soup.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = soup.mainColor;
                ctx.fill();

                // Butter Oil Swirl
                ctx.beginPath();
                ctx.arc(soup.x - 3, soup.y - 3, 7, 0, Math.PI * 2);
                ctx.fillStyle = soup.oilColor;
                ctx.fill();

                // Pot Handles
                ctx.fillStyle = "#3a1e0b";
                ctx.fillRect(soup.x - 31, soup.y - 4, 6, 8);
                ctx.fillRect(soup.x + 25, soup.y - 4, 6, 8);

                // Label
                ctx.fillStyle = "#ffb703";
                ctx.font = "bold 11px Arial";
                ctx.textAlign = "center";
                ctx.fillText(soup.name, soup.x, soup.y + 38);
            });
        }

        function drawTables() {
            tables.forEach(t => {
                // Table Shadow
                ctx.beginPath();
                ctx.ellipse(t.x, t.y + 20, 42, 15, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fill();

                // Wooden Table Top
                ctx.beginPath();
                ctx.arc(t.x, t.y, 38, 0, Math.PI * 2);
                ctx.fillStyle = "#633722";
                ctx.fill();
                ctx.strokeStyle = "#381e13";
                ctx.lineWidth = 4;
                ctx.stroke();

                // Inner Wood Grain
                ctx.beginPath();
                ctx.arc(t.x, t.y, 28, 0, Math.PI * 2);
                ctx.fillStyle = "#734028";
                ctx.fill();

                // Table Number
                ctx.fillStyle = "rgba(255,255,255,0.15)";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "center";
                ctx.fillText(t.id, t.x, t.y + 5);

                // Customer Logic
                if (t.status !== 'empty' && t.customer) {
                    drawPerson(t.x, t.y - 20, t.customer.color, false);

                    if (t.status === 'waiting') {
                        drawBubble(t.x + 25, t.y - 45, t.order);
                    } else if (t.status === 'eating') {
                        drawSoupBowl(t.x, t.y, t.order);
                        t.eatTimer--;
                        if (t.eatTimer <= 0) {
                            t.status = 'empty';
                            t.customer = null;
                            t.order = null;
                        }
                    }
                }
            });
        }

        function drawPerson(x, y, color, isChef) {
            // Shadow
            ctx.beginPath();
            ctx.ellipse(x, y + 18, 14, 6, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.fill();

            // Body / Torso
            ctx.beginPath();
            ctx.arc(x, y + 6, 13, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            // Head
            ctx.beginPath();
            ctx.arc(x, y - 8, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#f1c27d";
            ctx.fill();

            if (isChef) {
                // Chef Mustache & Hat
                ctx.fillStyle = "#3d2314";
                ctx.fillRect(x - 5, y - 6, 10, 3);

                // Big Chef Hat
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(x - 9, y - 22, 18, 10);
                ctx.beginPath();
                ctx.arc(x, y - 22, 11, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawChef() {
            // Interpolated Smooth Movement
            chef.x += (chef.targetX - chef.x) * chef.speed;
            chef.y += (chef.targetY - chef.y) * chef.speed;

            drawPerson(chef.x, chef.y, "#9e2a2b", true);

            // Carried Dish Tray
            if (chef.holding) {
                ctx.fillStyle = "#a8a29e";
                ctx.beginPath();
                ctx.arc(chef.x + 18, chef.y, 10, 0, Math.PI * 2);
                ctx.fill();
                drawSoupBowl(chef.x + 18, chef.y, chef.holding);
            }
        }

        function drawQueue() {
            queue.forEach((cust, i) => {
                drawPerson(37, 150 + (i * 55), cust.color, false);
            });
        }

        function drawBubble(x, y, orderId) {
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.roundRect(x - 18, y - 16, 42, 30, 8);
            ctx.fill();
            ctx.strokeStyle = "#ffb703";
            ctx.lineWidth = 2;
            ctx.stroke();

            drawSoupBowl(x + 3, y - 1, orderId);
        }

        function drawSoupBowl(x, y, soupId) {
            let soupObj = soups.find(s => s.id === soupId);
            if (!soupObj) return;

            // Ceramic Bowl
            ctx.beginPath();
            ctx.arc(x, y, 9, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.strokeStyle = "#2b1810";
            ctx.lineWidth = 1;
            ctx.stroke();

            // Soup Liquid inside bowl
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fillStyle = soupObj.mainColor;
            ctx.fill();
        }

        // --- MAIN LOOP ---
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawFloor();
            drawPots();
            drawTables();
            drawQueue();
            drawChef();

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
