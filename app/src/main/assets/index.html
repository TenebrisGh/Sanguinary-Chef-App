<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanguinary Chef - Real Recipe Challenge</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #141419;
            --primary-red: #8b0000;
            --accent-red: #d60000;
            --gold-accent: #ffd700;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            margin-bottom: 15px;
            width: 100%;
        }

        h1 {
            color: var(--gold-accent);
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--accent-red);
            font-size: 14px;
            margin-top: 5px;
            font-style: italic;
        }

        .stats-board {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--primary-red);
            border-radius: 8px;
            padding: 10px 0;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.4);
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #aaaaaa;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold-accent);
        }

        .order-card {
            background-color: var(--panel-bg);
            border: 2px solid var(--gold-accent);
            border-radius: 10px;
            padding: 15px;
            width: 90%;
            text-align: center;
            margin-bottom: 20px;
        }

        .order-title {
            color: var(--accent-red);
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ingredient-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn-ingredient {
            background-color: #22222a;
            color: var(--text-color);
            border: 1px solid var(--primary-red);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-ingredient:active {
            transform: scale(0.95);
            background-color: var(--primary-red);
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .btn-action {
            background-color: var(--primary-red);
            color: var(--gold-accent);
            border: 1px solid var(--gold-accent);
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 45%;
        }

        .btn-clear {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #555555;
        }

        #feedback {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            height: 24px;
            text-align: center;
        }

        .selected-box {
            background: #1a0000;
            border: 1px dashed var(--primary-red);
            padding: 8px;
            border-radius: 6px;
            min-height: 20px;
            margin-bottom: 15px;
            font-size: 13px;
            color: var(--gold-accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Sanguinary Chef</h1>
        <div class="subtitle">Gothic Gastronomy - Real Recipe Challenge</div>
    </header>

    <div class="stats-board">
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Time Left</div>
            <div class="stat-value" id="timer">60s</div>
        </div>
    </div>

    <div class="order-card">
        <div class="stat-label">Target Dish</div>
        <div class="order-title" id="dish-name">Loading Dish...</div>
        <div style="font-size: 12px; color: #888; margin-bottom: 8px;">Select Required Ingredients:</div>
        <div class="selected-box" id="selected-ingredients">None</div>
    </div>

    <div class="ingredient-list" id="ingredient-buttons">
        <!-- Ingredients will be generated by JS -->
    </div>

    <div class="actions">
        <button class="btn-action btn-clear" onclick="clearSelection()">Reset</button>
        <button class="btn-action" onclick="serveDish()">Serve Dish</button>
    </div>

    <div id="feedback"></div>

    <script>
        // Real Culinary Recipes with Gothic Themed Names
        const recipes = [
            { 
                name: "Sanguine Steak Tartare", 
                required: ["Beef Tenderloin", "Egg Yolk", "Capers", "Dijon Mustard"] 
            },
            { 
                name: "Blackened Angel Wings", 
                required: ["Chicken Wings", "Smoked Paprika", "Cayenne Pepper", "Garlic Powder"] 
            },
            { 
                name: "Blood Orange Sangria", 
                required: ["Red Wine", "Blood Orange Juice", "Cinnamon", "Brandy"] 
            },
            { 
                name: "Gothic Truffle Risotto", 
                required: ["Arborio Rice", "Black Truffle", "Parmesan Cheese", "Chicken Stock"] 
            }
        ];

        // Combined Real Ingredients Pool
        const allIngredients = [
            "Beef Tenderloin", "Egg Yolk", "Capers", "Dijon Mustard",
            "Chicken Wings", "Smoked Paprika", "Cayenne Pepper", "Garlic Powder",
            "Red Wine", "Blood Orange Juice", "Cinnamon", "Brandy",
            "Arborio Rice", "Black Truffle", "Parmesan Cheese", "Chicken Stock"
        ];

        let currentRecipe = {};
        let selected = [];
        let score = 0;
        let timeLeft = 60;
        let timerInterval;

        function initGame() {
            score = 0;
            timeLeft = 60;
            document.getElementById("score").innerText = score;
            document.getElementById("timer").innerText = timeLeft + "s";
            startTimer();
            nextRecipe();
            renderIngredients();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft + "s";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Time's Up! Your Final Banquet Score: " + score);
                    initGame();
                }
            }, 1000);
        }

        function nextRecipe() {
            selected = [];
            updateSelectedUI();
            const randomIndex = Math.floor(Math.random() * recipes.length);
            currentRecipe = recipes[randomIndex];
            document.getElementById("dish-name").innerText = currentRecipe.name;
        }

        function renderIngredients() {
            const container = document.getElementById("ingredient-buttons");
            container.innerHTML = "";
            allIngredients.forEach(ing => {
                const btn = document.createElement("button");
                btn.className = "btn-ingredient";
                btn.innerText = ing;
                btn.onclick = () => selectIngredient(ing);
                container.appendChild(btn);
            });
        }

        function selectIngredient(ing) {
            if (!selected.includes(ing)) {
                selected.push(ing);
                updateSelectedUI();
            }
        }

        function clearSelection() {
            selected = [];
            updateSelectedUI();
        }

        function updateSelectedUI() {
            const box = document.getElementById("selected-ingredients");
            box.innerText = selected.length > 0 ? selected.join(" + ") : "None";
        }

        function serveDish() {
            const feedback = document.getElementById("feedback");
            const isCorrect = currentRecipe.required.length === selected.length &&
                currentRecipe.required.every(val => selected.includes(val));

            if (isCorrect) {
                score += 10;
                feedback.style.color = "#00ff00";
                feedback.innerText = "+10 Perfect Recipe Prepared!";
            } else {
                score = Math.max(0, score - 5);
                feedback.style.color = "#ff3333";
                feedback.innerText = "-5 Ruined Dish!";
            }

            document.getElementById("score").innerText = score;
            setTimeout(() => { feedback.innerText = ""; }, 1500);
            nextRecipe();
        }

        window.onload = initGame;
    </script>
</body>
</html>
