<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soup House - Advanced Diner Sim</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #120b08;
            color: #f1faee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 5px;
        }

        h1 {
            color: #ffb703;
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 400px;
            background: #2c1d14;
            padding: 6px 12px;
            border-radius: 6px;
            border: 2px solid #ffb703;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        canvas {
            background: #231610;
            border: 4px solid #5c3a21;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .controls-hint {
            margin-top: 8px;
            font-size: 11px;
            color: #d3d3d3;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Soup House (Advanced)</h1>
    </header>

    <div class="hud">
        <span>Score: <span id="score" style="color: #ffb703;">0</span></span>
        <span>Time: <span id="timer" style="color: #e63946;">60s</span></span>
        <span>Carrying: <span id="carrying" style="color: #2a9d8f;">None</span></span>
    </div>

    <canvas id="gameCanvas" width="400" height="450"></canvas>

    <div class="controls-hint">
        1. Click Soup Pots on top to cook.<br>
        2. Click Waiting Customers to take orders / serve.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let timeLeft = 60;
        let carriedSoup = null; // 'Lentil', 'İşkembe', 'Beyran'

        // Counter (Kitchen) Pots Areas
        const pots = [
            { name: 'Lentil', x: 50, y: 30, color: '#e9c46a' },
            { name: 'İşkembe', x: 150, y: 30, color: '#f4f1de' },
            { name: 'Beyran', x: 250, y: 30, color: '#e63946' },
            { name: 'Ezogelin', x: 350, y: 30, color: '#f4a261' }
        ];

        // Restaurant Tables (Penguin Diner Style Positions)
        const tables = [
            { id: 0, x: 80, y: 200, customer: null, order: null, status: 'empty' }, // empty, waiting, eating, dirty
            { id: 1, x: 320, y: 200, customer: null, order: null, status: 'empty' },
            { id: 2, x: 80, y: 360, customer: null, order: null, status: 'empty' },
            { id: 3, x: 320, y: 360, customer: null, order: null, status: 'empty' }
        ];

        const soupNames = ['Lentil', 'İşkembe', 'Beyran', 'Ezogelin'];
        const customerEmojis = ['🧔🏻‍♂️', '🧕🏼', '👵🏻', '👨🏽'];

        // Game Timer
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft + "s";
                if (timeLeft === 0) {
                    alert("Shift Over! Final Score: " + score);
                    resetGame();
                }
            }
        }, 1000);

        // Customer Spawner Loop
        setInterval(() => {
            let emptyTables = tables.filter(t => t.status === 'empty');
            if (emptyTables.length > 0) {
                let randomTable = emptyTables[Math.floor(Math.random() * emptyTables.length)];
                randomTable.status = 'waiting';
                randomTable.customer = customerEmojis[Math.floor(Math.random() * customerEmojis.length)];
                randomTable.order = soupNames[Math.floor(Math.random() * soupNames.length)];
            }
        }, 3000);

        function resetGame() {
            score = 0;
            timeLeft = 60;
            carriedSoup = null;
            tables.forEach(t => { t.status = 'empty'; t.customer = null; t.order = null; });
            updateHUD();
        }

        // Canvas Click Mechanics
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check Pots Click (Cooking)
            pots.forEach(pot => {
                let dist = Math.hypot(mouseX - pot.x, mouseY - pot.y);
                if (dist < 30) {
                    carriedSoup = pot.name;
                    updateHUD();
                }
            });

            // Check Tables Click (Serving / Interacting)
            tables.forEach(table => {
                let dist = Math.hypot(mouseX - table.x, mouseY - table.y);
                if (dist < 40) {
                    if (table.status === 'waiting') {
                        if (carriedSoup === table.order) {
                            score += 10;
                            carriedSoup = null;
                            table.status = 'eating';
                            // Customer finishes eating after 3 seconds and leaves
                            setTimeout(() => {
                                table.status = 'empty';
                                table.customer = null;
                                table.order = null;
                            }, 3000);
                        } else if (carriedSoup !== null) {
                            score = Math.max(0, score - 5); // Wrong order penalty
                            carriedSoup = null;
                        }
                    }
                    updateHUD();
                }
            });
        });

        function updateHUD() {
            document.getElementById("score").innerText = score;
            document.getElementById("carrying").innerText = carriedSoup ? carriedSoup : "None";
        }

        // Main Render Loop
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Kitchen Counter Background
            ctx.fillStyle = "#3a2518";
            ctx.fillRect(0, 0, canvas.width, 70);
            ctx.strokeStyle = "#ffb703";
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, canvas.width, 70);

            // Draw Pots
            pots.forEach(pot => {
                ctx.beginPath();
                ctx.arc(pot.x, pot.y, 22, 0, Math.PI * 2);
                ctx.fillStyle = pot.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000";
                ctx.stroke();
                
                ctx.fillStyle = "#000";
                ctx.font = "bold 10px Arial";
                ctx.textAlign = "center";
                ctx.fillText(pot.name, pot.x, pot.y + 4);
            });

            // Draw Tables & Customers
            tables.forEach(table => {
                // Table Base
                ctx.beginPath();
                ctx.arc(table.x, table.y, 35, 0, Math.PI * 2);
                ctx.fillStyle = "#4a3121";
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#6b472f";
                ctx.stroke();

                // Table Label
                ctx.fillStyle = "#aaa";
                ctx.font = "10px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`Table ${table.id + 1}`, table.x, table.y + 25);

                // Customer & States
                if (table.status === 'waiting') {
                    // Draw Customer Emoji
                    ctx.font = "28px Arial";
                    ctx.fillText(table.customer, table.x, table.y - 2);

                    // Draw Order Bubble
                    ctx.fillStyle = "white";
                    ctx.fillRect(table.x - 30, table.y - 55, 60, 20);
                    ctx.strokeStyle = "#ffb703";
                    ctx.strokeRect(table.x - 30, table.y - 55, 60, 20);

                    ctx.fillStyle = "black";
                    ctx.font = "bold 9px Arial";
                    ctx.fillText(table.order, table.x, table.y - 41);
                } else if (table.status === 'eating') {
                    ctx.font = "28px Arial";
                    ctx.fillText("😋", table.x, table.y - 2);

                    ctx.fillStyle = "#2a9d8f";
                    ctx.font = "bold 10px Arial";
                    ctx.fillText("Enjoying!", table.x, table.y - 40);
                }
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
