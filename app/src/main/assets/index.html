<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanguinary Chef - Authentic Recipe Archives</title>
    <style>
        :root {
            --blood-red: #8b0000;
            --crimson: #d32f2f;
            --gold: #ffd700;
            --dark-gold: #c5a059;
            --bg-dark: #0a0a0c;
            --card-bg: rgba(26, 26, 32, 0.85);
            --text-light: #f5f5f5;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 85% 30%, rgba(197, 160, 89, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 10% 80%, rgba(139, 0, 0, 0.2) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(180deg, rgba(60, 0, 0, 0.8) 0%, rgba(10, 10, 12, 0) 100%);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding: 3rem 1rem 2rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .logo { 
            font-size: 3.5rem; 
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 15px rgba(211, 47, 47, 0.6));
        }

        h1 {
            color: var(--gold);
            margin: 0;
            font-size: 3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4), 2px 2px 4px #000;
        }

        .subtitle {
            color: var(--dark-gold);
            font-style: italic;
            font-size: 1.15rem;
            margin-top: 0.7rem;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1300px;
            margin: 2rem auto 4rem;
            padding: 0 1.5rem;
        }

        .controls-panel {
            background: rgba(20, 20, 26, 0.75);
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 1.8rem;
            border-radius: 16px;
            margin-bottom: 2.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(139, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .controls-panel { grid-template-columns: 1fr; }
            h1 { font-size: 2rem; }
        }

        label {
            color: var(--gold);
            font-weight: 600;
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(12, 12, 16, 0.8);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: #fff;
            font-size: 0.95rem;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            background: rgba(18, 18, 24, 0.95);
        }

        .stats-bar {
            color: var(--dark-gold);
            margin-bottom: 1.8rem;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .recipe-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-top: 4px solid var(--crimson);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .recipe-card:hover {
            transform: translateY(-7px);
            border-color: var(--gold);
            box-shadow: 0 15px 30px rgba(139, 0, 0, 0.4), 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .card-header-banner {
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.6) 0%, rgba(20, 20, 26, 0.9) 100%);
            padding: 1.2rem 1.4rem 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .recipe-card h3 {
            color: var(--gold);
            margin: 0;
            font-size: 1.25rem;
            line-height: 1.3;
            font-weight: 700;
        }

        .cuisine-badge {
            background: linear-gradient(135deg, #8b0000 0%, #b22222 100%);
            color: #fff;
            padding: 4px 10px;
            font-size: 0.68rem;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            white-space: nowrap;
            margin-left: 10px;
        }

        .recipe-content {
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .macro-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: rgba(10, 10, 14, 0.7);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .macro-box {
            display: flex;
            flex-direction: column;
        }

        .macro-label {
            font-size: 0.65rem;
            color: var(--dark-gold);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .macro-value {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 700;
            margin-top: 2px;
        }

        .ingredients-title {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.88rem;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
            padding-bottom: 6px;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        ul {
            padding-left: 1.2rem;
            color: #d1d1d1;
            margin: 0 0 1.5rem 0;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        ul li::marker {
            color: var(--crimson);
        }

        .match-tag {
            margin-top: auto;
            background: rgba(139, 0, 0, 0.2);
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: var(--gold);
            padding: 8px;
            text-align: center;
            font-size: 0.82rem;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>

        function filterRecipes() {
            const selectedCuisine = document.getElementById("cuisineSelect").value;
            const nameInput = document.getElementById("nameSearch").value.toLowerCase().trim();
            const ingredientInput = document.getElementById("ingredientSearch").value.toLowerCase().trim();
            const userIngredients = ingredientInput ? ingredientInput.split(",").map(i => i.trim()).filter(i => i !== "") : [];
            
            const container = document.getElementById("recipeResults");
            const statsBar = document.getElementById("statsBar");

            container.innerHTML = "";

            const filtered = recipes.filter(recipe => {
                const matchesCuisine = (selectedCuisine === "ALL" || recipe.cuisine === selectedCuisine);
                const matchesName = !nameInput || recipe.name.toLowerCase().includes(nameInput);
                const matchesIngredients = userIngredients.length === 0 || userIngredients.some(ing => recipe.searchKeywords.some(k => k.includes(ing)));
                
                return matchesCuisine && matchesName && matchesIngredients;
            });

            statsBar.innerText = `Showing ${filtered.length} of ${recipes.length} Authentic Recipes`;

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: var(--crimson); font-size: 1.2rem; grid-column: 1/-1; text-align: center; padding: 3rem;">No sacred recipes matched your criteria in the Chapter Archives.</p>`;
                return;
            }

            filtered.forEach(recipe => {
                const matchedCount = userIngredients.length > 0 
                    ? recipe.searchKeywords.filter(ing => userIngredients.some(u => ing.includes(u))).length 
                    : recipe.searchKeywords.length;

                const card = document.createElement("div");
                card.className = "recipe-card";
                card.innerHTML = `
                    <div class="card-header-banner">
                        <h3>${recipe.name}</h3>
                        <span class="cuisine-badge">${recipe.cuisine}</span>
                    </div>
                    <div class="recipe-content">
                        <div class="macro-container">
                            <div class="macro-box">
                                <span class="macro-label">Calories</span>
                                <span class="macro-value">${recipe.calories}</span>
                            </div>
                            <div class="macro-box">
                                <span class="macro-label">Protein</span>
                                <span class="macro-value">${recipe.protein}</span>
                            </div>
                            <div class="macro-box">
                                <span class="macro-label">Carbs</span>
                                <span class="macro-value">${recipe.carbs}</span>
                            </div>
                            <div class="macro-box">
                                <span class="macro-label">Fat</span>
                                <span class="macro-value">${recipe.fat}</span>
                            </div>
                        </div>

                        <div class="ingredients-title">Exact Ingredients & Measurements</div>
                        <ul>
                            ${recipe.ingredientsDetailed.map(ing => `<li>${ing}</li>`).join("")}
                        </ul>
                        <div class="match-tag">${userIngredients.length > 0 ? `Matches ${matchedCount} ingredient(s)` : 'Sacred Recipe'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        filterRecipes();
    </script>
